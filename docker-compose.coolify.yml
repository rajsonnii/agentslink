# ========================================================
# Agent Slink - Coolify Multi-Service Docker Compose Setup
# ========================================================
# To deploy on Coolify:
# 1. In Coolify, create a New Resource -> Docker Compose
# 2. Select this Git Repository
# 3. Point Compose File to "docker-compose.coolify.yml"
# 4. Fill in Environment Variables in the Coolify UI
# 5. Click Deploy!
# ========================================================

services:
  # ------------------------------------------------------
  # Slink API & Log Streaming Intake (Exposed on Coolify)
  # ------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: always
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-slink}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-slink}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.0-flash-001}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - SLINK_DATA_DIR=/app/data
    volumes:
      - slink_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coolify
      - slink_internal

  # ------------------------------------------------------
  # Slink SaaS Web Dashboard (Exposed on Coolify)
  # ------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: always
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - SLINK_INTERNAL_API_URL=http://api:4000
      - NEXT_PUBLIC_SLINK_API_URL=${NEXT_PUBLIC_SLINK_API_URL}
    depends_on:
      - api
    networks:
      - coolify
      - slink_internal

  # ------------------------------------------------------
  # PostgreSQL Persistence
  # ------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-slink}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slink} -d ${POSTGRES_DB:-slink}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - slink_internal

networks:
  coolify:
    external: true
  slink_internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  slink_data:
    driver: local
